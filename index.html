<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Goodsell Cell Simulator (2D Orthographic)</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #f7f4ea;
      --panel-bg: rgba(26, 24, 21, 0.85);
      --panel-text: #f7f4ea;
      --accent: #d96b52;
      --accent-hover: #e5836d;
      --border: #44403a;
      --font-serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: #1a1815;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* HUD Header Title */
    .header-banner {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      color: var(--panel-text);
      padding: 14px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      backdrop-filter: blur(8px);
      max-width: 380px;
      border: 1px solid var(--border);
    }

    .header-banner h1 {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .header-banner p {
      font-size: 0.8rem;
      color: #d1cbc1;
      line-height: 1.35;
    }

    /* HUD Controls Panel */
    .hud-panel {
      position: absolute;
      bottom: 25px;
      left: 20px;
      z-index: 10;
      background: var(--panel-bg);
      color: var(--panel-text);
      padding: 16px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      width: 330px;
      border: 1px solid var(--border);
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
      color: #e3ded6;
    }

    .control-group select, .control-group input[type="range"] {
      width: 100%;
      background: #2b2723;
      color: #ffffff;
      border: 1px solid #48433d;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.82rem;
      outline: none;
    }

    .control-group select:focus {
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn.secondary {
      background: #3b3630;
      color: #e3ded6;
    }

    .btn.secondary:hover {
      background: #4a443d;
    }

    .btn.active {
      background: #4a8b53;
    }

    .nav-hint {
      margin-top: 10px;
      font-size: 0.72rem;
      color: #b3ac9f;
      text-align: center;
      border-top: 1px solid #3d3730;
      padding-top: 8px;
    }

    /* Inspector Hover Tooltip */
    #inspector-tooltip {
      position: absolute;
      z-index: 100;
      display: none;
      pointer-events: none;
      background: rgba(18, 16, 14, 0.92);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      max-width: 250px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      border: 1px solid #4e4840;
      backdrop-filter: blur(6px);
    }

    .tooltip-title {
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 0.9rem;
      color: #f7d1ba;
      margin-bottom: 2px;
    }

    .tooltip-badge {
      display: inline-block;
      background: var(--accent);
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      margin-bottom: 4px;
    }

    .tooltip-meta {
      font-size: 0.72rem;
      color: #b0aaa0;
      margin-bottom: 4px;
    }

    .tooltip-desc {
      font-size: 0.75rem;
      color: #ded9d0;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- Three.js Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Header Banner -->
  <header class="header-banner">
    <h1>Goodsell 2D Cell Simulator</h1>
    <p>2D orthographic anatomical cross-section with continuous watercolor vector contours and fine ink outlines.</p>
  </header>

  <!-- HUD Control Panel -->
  <div class="hud-panel">
    <div class="control-group">
      <label for="scene-select">Preset 2D Scene</label>
      <select id="scene-select">
        <option value="crowded-ecoli">E. coli Envelope &amp; Cytoplasm (2D Slice)</option>
        <option value="focal-ribosome">70S Ribosome 2D Focus</option>
        <option value="focal-atpsynthase">ATP Synthase &amp; Membrane Focus</option>
      </select>
    </div>

    <div class="control-group">
      <label for="palette-select">Goodsell Palette</label>
      <select id="palette-select">
        <option value="ecoli">E. coli Cytoplasm (Classic)</option>
        <option value="mycoplasma">Mycoplasma Genitalium</option>
        <option value="sarscov2">SARS-CoV-2 Virion</option>
        <option value="blood">Red Blood Cell &amp; Plasma</option>
      </select>
    </div>

    <div class="control-group">
      <label>Ink Outline Stroke <span id="outline-val">1.5px</span></label>
      <input type="range" id="outline-slider" min="0.5" max="4.0" step="0.1" value="1.5">
    </div>

    <div class="control-group">
      <label>Watercolor Tone Steps <span id="tone-val">3 steps</span></label>
      <input type="range" id="tone-slider" min="2" max="5" step="1" value="3">
    </div>

    <div class="control-group">
      <label>Simulation Speed <span id="speed-val">1.0x</span></label>
      <input type="range" id="speed-slider" min="0.0" max="3.0" step="0.1" value="1.0">
    </div>

    <div class="btn-row">
      <button class="btn" id="btn-pause">⏸ Pause</button>
      <button class="btn secondary" id="btn-reset-cam">🔍 Reset 2D View</button>
    </div>

    <div class="nav-hint">
      2D Pan: Drag mouse/touch · Orthographic Zoom: Scroll wheel
    </div>
  </div>

  <!-- Inspector Hover Tooltip -->
  <div id="inspector-tooltip"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
